name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-verify:
    name: Go Test & Read-Only AST Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test & Read-Only AST Audit
        run: go test -race -count=1 ./...
      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/tgread

  nix-verify:
    name: Nix Flake & vendorHash Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Verify flake check and sandboxed Nix build
        run: |
          nix flake check --no-build
          nix build --no-link
          nix run . -- version
